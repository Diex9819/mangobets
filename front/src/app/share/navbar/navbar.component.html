<div class="navbar">

  <!-- LOGO → HOME (Tabla de Posiciones) -->
  <div class="logo" routerLink="/">
    <span class="ball">⚽</span>
    <span>MangoBets ⚽</span>
  </div>

  <!-- MENU: PESTAÑAS -->
  <div class="menu">

    <!-- 🏆 TABLA DE POSICIONES -->
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      🏆 Posiciones
    </a>

    <!-- ⚽ QUINIELAS: visible siempre (público) -->
    <a routerLink="/quiniela" routerLinkActive="active">
      ⚽ Quinielas
    </a>

  </div>

  <!-- USER (solo si hay sesión iniciada) -->
  <div class="user" *ngIf="haySesion">
    <div class="avatar">👤</div>
    <span>{{ user.name }}</span>
    <span *ngIf="isAdmin" class="admin-badge">👑 Admin</span>
    <button (click)="logout()">Salir</button>
  </div>

  <!-- 🔐 LOGIN (solo si no hay sesión iniciada) -->
  <div class="login-action" *ngIf="!haySesion">
    <a routerLink="/login" class="btn-login">Iniciar Sesión</a>
  </div>

</div>
